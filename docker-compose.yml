services:
  backend:
    build: ./backend
    container_name: lexiguard-ai-backend
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - CORS_ORIGINS=["http://localhost:5173","http://localhost:3000","http://localhost"]
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build: ./frontend
    container_name: lexiguard-ai-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
